name: Deploy Staging

on:
  push:
    branches: [develop]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --no-optional

      - name: Deploy to Vercel (preview)
        id: vercel
        run: |
          npx vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel build --token=${{ secrets.VERCEL_TOKEN }}
          URL=$(npx vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Run migrations
        run: pnpm run db:migrate
        env:
          MONGODB_URI: ${{ secrets.STAGING_MONGODB_URI }}

      - name: Setup bot
        run: pnpm run bot:setup
        env:
          BOT_TOKEN: ${{ secrets.STAGING_BOT_TOKEN }}
          WEBHOOK_URL: ${{ steps.vercel.outputs.url }}
          WEBHOOK_SECRET: ${{ secrets.STAGING_WEBHOOK_SECRET }}

      - name: Smoke test
        run: curl -sf "${{ steps.vercel.outputs.url }}/api/health"
