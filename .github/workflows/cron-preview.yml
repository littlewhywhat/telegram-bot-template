name: Preview Cron

on:
  schedule:
    - cron: '10 6,20 * * *'
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  trigger-cron:
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'trigger-cron' }}
    runs-on: ubuntu-latest
    steps:
      - name: Get latest preview deployment URL
        id: deployment
        run: |
          URL=$(curl -sf "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&state=READY&limit=1&target=preview" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | jq -r '"https://" + .deployments[0].url')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Trigger cron
        run: curl -sf "${{ steps.deployment.outputs.url }}/api/cron"
