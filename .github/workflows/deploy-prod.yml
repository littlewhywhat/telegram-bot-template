name: Deploy Production

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check tag format
        run: |
          if [[ ! "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::This workflow must be run on a tag matching v*.*.* (got '${{ github.ref_name }}')"
            exit 1
          fi

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    uses: ./.github/workflows/_deploy-tg-bot.yml
    with:
      environment_name: production
    secrets:
      MONGODB_URI: ${{ secrets.PROD_MONGODB_URI }}
      BOT_TOKEN: ${{ secrets.PROD_BOT_TOKEN }}
      WEBHOOK_SECRET: ${{ secrets.PROD_WEBHOOK_SECRET }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
