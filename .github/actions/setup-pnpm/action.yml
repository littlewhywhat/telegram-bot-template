name: Setup pnpm + Node
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v5
    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: 'pnpm'
    - shell: bash
      run: pnpm install --frozen-lockfile ${{ inputs.full_install == 'true' && '' || '--no-optional' }}
inputs:
  full_install:
    required: false
    default: 'false'
